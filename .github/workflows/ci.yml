# Lint, typecheck, test and build on every push to main and every pull request.
#
# The same file in eric-shell, classifieds-mcp and local-foodie: keep it identical and change it in
# all three at once. street-scene has none on purpose (see its deploy skill). Each step is `--if-present`, so a repo runs whichever of the four
# scripts it defines, and Node comes from the repo's .nvmrc, the same version Vercel builds on.
#
# No secrets: nothing here may need a database, an API key or the network beyond npm. A test that
# does has to skip itself without its env var, as it would on a fresh clone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
