<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A1033" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 | Eric Shell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:GRAD,wght@-25..150,400..700&display=swap" rel="stylesheet" />
    <!--
      STANDALONE PAGE. Vercel serves this straight out of /public for any
      unmatched path, so there is no React, no Tailwind build and no shared
      stylesheet available here. The site's ink field, Display headline and
      `luminous` button are hand-ported below.

      403.html and src/admin/components/Login.tsx are the same layout. The
      style block is duplicated between the two static files ON PURPOSE:
      extracting it to a shared asset would make an error page depend on a
      second network request that may itself be what is failing, and two
      hand-written files do not justify a template pipeline. The two blocks
      must stay byte-identical (tests/ui-vocabulary.test.ts checks), so a
      change to one is a paste into the other.
    -->
    <style>
      @font-face {
        font-family: 'Display';
        src: url('/fonts/display.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        /* The Luminous tokens this page needs, restated from @theme in
           src/index.css. tests/ui-vocabulary.test.ts fails if they drift. */
        --ink: #0A1033;
        --lum: #2B54FF;
        --lum-deep: #1D3FD6;
      }

      *, *::before, *::after { margin: 0; box-sizing: border-box; }

      html { background: var(--ink); }

      /* The ink field, the same one the admin sign-in stands on. */
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 3rem 1.5rem;
        background: var(--ink);
        color: #fff;
        font-family: 'Google Sans', system-ui, sans-serif;
        font-weight: 550;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        text-align: center;
      }

      /* Same vertical rhythm as the other error page and the admin Login. */
      main {
        width: 100%;
        max-width: 30rem;
      }
      .brand {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
      }
      .brand img { height: 2.5rem; }

      /* Eyebrow */
      .eyebrow {
        display: block;
        margin-bottom: 0.75rem;
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-variation-settings: 'GRAD' 150;
        color: rgb(255 255 255 / 0.85);
      }

      /* Display heading: --tracking-display */
      h1 {
        margin-bottom: 1.25rem;
        font-family: 'Display', system-ui, sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        line-height: 1;
        font-size: clamp(2.25rem, 9vw, 4.5rem);
      }

      /* White at 65% on ink is 8.1:1. */
      .lede {
        margin: 0 auto 2rem;
        max-width: 26rem;
        font-size: 1rem;
        line-height: 1.6;
        color: rgb(255 255 255 / 0.65);
      }

      /* Button variant="luminous" */
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border: 1px solid transparent;
        border-radius: 0.5rem;
        background: var(--lum);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 200ms, box-shadow 200ms, transform 200ms;
      }
      /* Mirrors SURFACE_HOVER.luminous. The inset edge is what keeps the
         button visible: its darker hover fill alone is 2.4:1 against ink. */
      .cta:hover {
        background: var(--lum-deep);
        box-shadow:
          inset 0 1px 0 0 rgb(255 255 255 / 0.3),
          inset 0 0 0 1px rgb(255 255 255 / 0.14);
        transform: scale(1.035);
      }
      .cta:active { transform: scale(0.985); }

      ::selection { background: var(--lum); color: #fff; }
      /* White, as on every ink field: a blue ring here would be 3.4:1. */
      :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        .cta { transition: none; }
        .cta:hover, .cta:active { transform: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/icon.svg" alt="" />
        <img src="/logo.svg" alt="Eric Shell" />
      </div>
      <span class="eyebrow">Error 404</span>
      <h1>Page not found</h1>
      <p class="lede">
        There's nothing at this address. The work, testimonials, visuals and contact
        form all live on the homepage.
      </p>
      <a class="cta" href="/">Back to eric.sh</a>
    </main>
  </body>
</html>
