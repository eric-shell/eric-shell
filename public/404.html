<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 | Eric Shell</title>
    <style>
      @font-face {
        font-family: 'Display';
        src: url('/fonts/display.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: oklch(0.107 0.011 266.51);
        color: #fff;
        font-family: system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 2rem;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
      img { height: 2.5rem; opacity: 0.9; }
      h1 {
        font-family: 'Display', system-ui, sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 1;
      }
      p { color: rgba(255, 255, 255, 0.6); font-size: 1rem; line-height: 1.6; max-width: 26rem; }
      a.home {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.65rem 1.5rem;
        border-radius: 0.5rem;
        background: linear-gradient(to bottom right, oklch(0.546 0.091 231.5), oklch(0.497 0.093 232.07));
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        transition: filter 200ms;
      }
      a.home:hover { filter: brightness(0.85); }
      ::selection { background: oklch(0.546 0.091 231.5); color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Eric Shell" />
      <h1>404</h1>
      <p>This page doesn't exist. The work, testimonials, visuals, and contact form all live on the homepage.</p>
      <a class="home" href="/">Back to eric.sh</a>
    </main>
  </body>
</html>
