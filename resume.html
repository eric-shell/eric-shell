    -->

      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfilePage",
          "@id": "https://eric.sh/resume#page",

          "name": "Resume | Eric Shell",
          "mainEntity": { "@id": "https://eric.sh/#person" },
          "isPartOf": { "@id": "https://eric.sh/#website" }
        },
        {
          "@type": "Person",
          "@id": "https://eric.sh/#person",
          "name": "Eric Shell",
          "url": "https://eric.sh/",
          "jobTitle": "AI Design Systems Engineer",
          "description": "AI Design Systems Engineer with over 15 years building modern web and mobile applications. Front-end architecture across enterprise marketing platforms, with large language models integrated into how those systems are built and delivered.",

          "worksFor": { "@type": "Organization", "name": "MMGY Global" },
          "alumniOf": { "@type": "CollegeOrUniversity", "name": "Lehigh University" },
          "hasOccupation": {

            "name": "AI Design Systems Engineer",
            "occupationalCategory": "15-1254.00",

        },

            { "@type": "ListItem", "position": 2, "name": "Resume" }
