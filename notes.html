    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The Blog + itemListElement JSON-LD for this page is INJECTED AT BUILD TIME
      by the `notesSchema()` plugin in vite.config.ts, from src/data/notes.ts,
      the same reason the work grid's ItemList is generated rather than pasted.
      A hand-written copy would be stale the first time an entry was added, and
      a blog index whose structured data lists posts that no longer match the
      page is worse than one with none.

      The per-entry documents under /notes/<slug> are generated wholesale by
      `notesEntries()` in the same file. This document is the only hand-written
      head in the notes route. See resume.html for why the Person node is
      referenced by @id rather than redefined.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Version-pinned latin subset. See index.html for why this is preloaded
         rather than self-hosted, and how to refresh the URL. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
